<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess-Meter</title>
<style>
  body{font-family:system-ui,sans-serif;background:#fff8ee;margin:0;color:#2b2118}
  header{background:#e8590c;color:#fff;padding:20px;text-align:center}
  header h1{margin:0}
  main{max-width:560px;margin:auto;padding:16px}
  .card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0002}
  h2{margin:0 0 4px;text-transform:capitalize}
  .bar{height:10px;border-radius:5px;background:#ffd6d6;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;background:#2f9e44}
  button{font-size:18px;border:0;border-radius:12px;padding:10px 18px;margin-right:8px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .up{background:#d3f9d8}.down{background:#ffe3e3}
  #msg{color:#c92a2a;min-height:20px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<header><h1>🍛 Mess-Meter</h1><div id="date"></div></header>
<main>
  <div id="msg"></div>
  <div id="list">Loading…</div>
  <div class="card"><h2>Last 7 days</h2><div id="week">Loading…</div></div>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const d = await (await fetch('/api/today')).json();
  document.getElementById('date').textContent = 'Today · ' + d.date;
  document.getElementById('list').innerHTML = d.meals.length ? d.meals.map((m) => {
    const t = m.up + m.down, p = t ? Math.round(m.up / t * 100) : 0;
    return `<div class="card"><h2>${esc(m.meal)}</h2><div>${esc(m.items)}</div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <small>${t ? p + '% liked · ' + t + ' votes' : 'No votes yet'}</small><br><br>
      <button class="up" ${m.voted ? 'disabled' : ''} onclick="vote('${m.meal}','up')">👍 ${m.up}</button>
      <button class="down" ${m.voted ? 'disabled' : ''} onclick="vote('${m.meal}','down')">👎 ${m.down}</button>
      ${m.voted ? '<small>You voted</small>' : ''}</div>`;
  }).join('') : '<p>No menu loaded for today.</p>';
}

async function loadWeek() {
  const rows = await (await fetch('/api/week')).json();
  document.getElementById('week').innerHTML = rows.length
    ? '<table><tr><th>Date</th><th>Meal</th><th>👍</th><th>👎</th></tr>' +
      rows.map((r) => `<tr><td>${esc(r.date)}</td><td>${esc(r.meal)}</td><td>${r.up}</td><td>${r.down}</td></tr>`).join('') + '</table>'
    : 'No votes yet.';
}

async function vote(meal, v) {
  const r = await fetch('/api/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ meal, vote: v }) });
  document.getElementById('msg').textContent = r.ok ? '' : (await r.json()).error;
  load(); loadWeek();
}

load(); loadWeek();
setInterval(load, 5000);
</script>
</body>
</html>
